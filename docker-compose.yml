name: smm-reseller

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smm_password}
      POSTGRES_DB: ${POSTGRES_DB:-smm_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smm_user} -d ${POSTGRES_DB:-smm_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smm_user}:${POSTGRES_PASSWORD:-smm_password}@postgres:5432/${POSTGRES_DB:-smm_bot}
    command: sh -c "npx prisma migrate deploy && node dist/prisma/seed.js"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smm_user}:${POSTGRES_PASSWORD:-smm_password}@postgres:5432/${POSTGRES_DB:-smm_bot}
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/src/api/server.js"]
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smm_user}:${POSTGRES_PASSWORD:-smm_password}@postgres:5432/${POSTGRES_DB:-smm_bot}
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/src/bot/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smm_user}:${POSTGRES_PASSWORD:-smm_password}@postgres:5432/${POSTGRES_DB:-smm_bot}
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/src/workers/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
